<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BOL Auto-Fill</title>
    <style>
      :root {
        --ink: #1c2024;
        --muted: #6b7280;
        --border: #d9dde3;
        --accent: #2563eb;
        --bg: #ffffff;
        --bg-soft: #f6f7f9;
        --error: #c02626;
        --success: #15803d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        max-width: 560px;
        margin: 40px auto;
        padding: 0 20px;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        color: var(--ink);
        background: var(--bg);
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 20px 0;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 5px;
        margin-top: 14px;
      }
      label:first-of-type {
        margin-top: 0;
      }
      input[type="file"] {
        width: 100%;
        font-size: 13px;
        padding: 8px;
        border: 1px dashed var(--border);
        border-radius: 6px;
        background: var(--bg-soft);
      }
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 13px;
        background: var(--bg);
        color: var(--ink);
      }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 11px;
        border: none;
        border-radius: 6px;
        background: var(--accent);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        background: var(--border);
        color: var(--muted);
        cursor: not-allowed;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
        min-height: 18px;
      }
      #status.error {
        color: var(--error);
      }
      #status.success {
        color: var(--success);
      }
      pre {
        margin-top: 12px;
        padding: 12px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-size: 12px;
        max-height: 420px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>BOL Auto-Fill</h1>

    <label for="fileInput">Document</label>
    <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" />

    <label for="modeSelect">Extraction mode</label>
    <select id="modeSelect">
      <option value="groq">Groq</option>
      <option value="gemini">Gemini</option>
    </select>

    <label for="targetSelect">Target form</label>
    <select id="targetSelect">
      <option value="netchb">NetCHB</option>
      <option value="ace">ACE</option>
      <option value="both">Both</option>
    </select>

    <button id="extractBtn">Extract</button>

    <div id="status"></div>
    <pre id="result" style="display: none"></pre>

    <button
      id="fillBtn"
      style="display: none; margin-top: 8px; background: #15803d"
    >
      Fill NetCHB Form (active tab)
    </button>
    <div
      id="fillStatus"
      style="margin-top: 8px; font-size: 13px; color: var(--muted)"
    ></div>

    <script src="extract.js"></script>
  </body>
</html>
